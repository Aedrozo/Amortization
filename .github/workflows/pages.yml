name: Deploy calculator to GitHub Pages

# Publishes the calculator on every push. The engine tests run first, so a
# change that breaks the math never reaches the live site.

on:
  push:
    branches:
      - main
      - claude/mortgage-amortization-calculator-o5woht
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the calculation engine
        run: node --test tests/finance.test.mjs

      # Regenerates the brand marks. Picks up real artwork dropped into
      # assets/img/neo-logo-navy.* automatically, so replacing the traced NEO
      # half is just a matter of committing the file. Tolerated on failure: if
      # the toolchain is unavailable the committed marks are used as-is.
      - name: Rebuild the brand marks
        continue-on-error: true
        run: npm ci --no-audit --no-fund && npm run build:logo

      - name: Build the single-file bundle
        run: node build.mjs dist/standalone.html

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp dist/standalone.html _site/
          # Tell Pages not to run the files through Jekyll.
          touch _site/.nojekyll
          # Any unknown path falls back to the calculator rather than a 404 page.
          cp index.html _site/404.html
          ls -R _site | head -40

      - name: Configure Pages
        id: pages
        # enablement: true asks GitHub to turn Pages on. The Actions token is
        # allowed to DEPLOY to Pages but not always to CREATE the site, so this
        # can fail with "Resource not accessible by integration" until someone
        # with admin rights enables Pages once. The next step explains that.
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Explain how to finish enabling Pages
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::One-time setup required."
          cat <<'MSG'
          The workflow built and tested the site successfully, but it cannot switch
          GitHub Pages on by itself — the Actions token is permitted to deploy to
          Pages, not to create the Pages site.

          To finish, once:
            Settings -> Pages -> Build and deployment -> Source: GitHub Actions

          Then re-run this workflow. Every push after that deploys automatically.
          MSG
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
